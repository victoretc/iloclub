              - paragraph [ref=f132e399]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - paragraph [ref=f132e400]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f132e401]:
              - paragraph [ref=f132e402]: "Оплата возможна только через ЕРИП:"
