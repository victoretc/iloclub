          - paragraph [ref=f132e390]: Пять пунктов, которые действуют для всех гостей — от сменной обуви до отмены брони.
        - generic [ref=f132e391]:
          - figure [ref=f132e392]:
            - img "Памятка с правилами посещения ILO Club" [ref=f132e393]
          - list [ref=f132e394]:
            - listitem [ref=f132e395]:
              - paragraph [ref=f132e396]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f132e397]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
