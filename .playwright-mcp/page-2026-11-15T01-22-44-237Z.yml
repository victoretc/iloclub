        - heading "Правила посещения клуба" [level=2] [ref=f305e277]
        - list [ref=f305e278]:
          - listitem [ref=f305e279]:
            - paragraph [ref=f305e280]:
              - strong [ref=f305e281]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - text: Администратор вправе не пустить на корт в случае, если сменной обуви у кого-то не будет, стоимость аренды в этом случае возвращаться не будет.
          - listitem [ref=f305e282]:
            - paragraph [ref=f305e283]:
              - strong [ref=f305e284]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - text: Без полной оплаты мы не бронируем время, и оно остаётся открытым для других желающих.
          - listitem [ref=f305e285]:
            - paragraph [ref=f305e286]:
              - strong [ref=f305e287]: "Оплата возможна только через ЕРИП:"
              - text: по карте через онлайн банкинг; наличными через ЕРИП терминалы по городу.
          - listitem [ref=f305e288]:
            - paragraph [ref=f305e289]:
              - strong [ref=f305e290]: На территории ILO CLUB запрещено оказывать тренерские услуги.
              - text: Тренировки доступны от тренеров команды ILO.
          - listitem [ref=f305e291]:
            - paragraph [ref=f305e292]:
              - strong [ref=f305e293]: "Отмена или перенос бронирования:"
              - text: За 24 часа до занятия — бесплатно. За 12–24 часа до занятия — возвращается 50% стоимости занятия. За менее чем 12 часов до занятия — сумма не возвращается.
