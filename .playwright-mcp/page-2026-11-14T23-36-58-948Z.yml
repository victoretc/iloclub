              - paragraph [ref=f147e381]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f147e382]:
              - paragraph [ref=f147e383]: "Оплата возможна только через ЕРИП:"
              - list [ref=f147e384]:
                - listitem [ref=f147e385]: по карте через онлайн-банкинг;
                - listitem [ref=f147e386]: наличными через ЕРИП-терминалы по городу.
            - listitem [ref=f147e387]:
              - paragraph [ref=f147e388]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f147e389]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f147e390]:
              - paragraph [ref=f147e391]: "Отмена или перенос бронирования:"
              - list [ref=f147e392]:
                - listitem [ref=f147e393]: за 24 часа до занятия — бесплатно;
                - listitem [ref=f147e394]: за 12–24 часа до занятия — возвращается 50% стоимости занятия;
                - listitem [ref=f147e395]: менее чем за 12 часов до занятия — сумма не возвращается.
