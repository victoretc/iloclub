      - generic [ref=f309e304]:
        - heading "Правила посещения клуба" [level=2] [ref=f309e305]
        - list [ref=f309e306]:
          - listitem [ref=f309e307]:
            - paragraph [ref=f309e308]:
              - strong [ref=f309e309]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - text: Администратор вправе не пустить на корт в случае, если сменной обуви у кого-то не будет, стоимость аренды в этом случае возвращаться не будет.
          - listitem [ref=f309e310]:
            - paragraph [ref=f309e311]:
              - strong [ref=f309e312]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - text: Без полной оплаты мы не бронируем время, и оно остаётся открытым для других желающих.
          - listitem [ref=f309e313]:
            - paragraph [ref=f309e314]:
              - strong [ref=f309e315]: "Оплата возможна только через ЕРИП:"
              - text: по карте через онлайн банкинг; наличными через ЕРИП терминалы по городу.
          - listitem [ref=f309e316]:
            - paragraph [ref=f309e317]:
              - strong [ref=f309e318]: На территории ILO CLUB запрещено оказывать тренерские услуги.
              - text: Тренировки доступны от тренеров команды ILO.
          - listitem [ref=f309e319]:
            - paragraph [ref=f309e320]:
              - strong [ref=f309e321]: "Отмена или перенос бронирования:"
              - text: За 24 часа до занятия — бесплатно. За 12–24 часа до занятия — возвращается 50% стоимости занятия. За менее чем 12 часов до занятия — сумма не возвращается.
