              - paragraph [ref=f145e362]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f145e363]:
              - paragraph [ref=f145e364]: "Оплата возможна только через ЕРИП:"
              - list [ref=f145e365]:
                - listitem [ref=f145e366]: по карте через онлайн-банкинг;
                - listitem [ref=f145e367]: наличными через ЕРИП-терминалы по городу.
            - listitem [ref=f145e368]:
              - paragraph [ref=f145e369]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f145e370]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f145e371]:
              - paragraph [ref=f145e372]: "Отмена или перенос бронирования:"
              - list [ref=f145e373]:
                - listitem [ref=f145e374]: за 24 часа до занятия — бесплатно;
                - listitem [ref=f145e375]: за 12–24 часа до занятия — возвращается 50% стоимости занятия;
                - listitem [ref=f145e376]: менее чем за 12 часов до занятия — сумма не возвращается.
