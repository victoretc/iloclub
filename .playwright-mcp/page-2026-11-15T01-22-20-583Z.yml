        - list [ref=f303e278]:
          - listitem [ref=f303e279]:
            - paragraph [ref=f303e280]:
              - strong [ref=f303e281]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - text: Администратор вправе не пустить на корт в случае, если сменной обуви у кого-то не будет, стоимость аренды в этом случае возвращаться не будет.
          - listitem [ref=f303e282]:
            - paragraph [ref=f303e283]:
              - strong [ref=f303e284]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - text: Без полной оплаты мы не бронируем время, и оно остаётся открытым для других желающих.
          - listitem [ref=f303e285]:
            - paragraph [ref=f303e286]:
              - strong [ref=f303e287]: "Оплата возможна только через ЕРИП:"
              - text: по карте через онлайн банкинг; наличными через ЕРИП терминалы по городу.
          - listitem [ref=f303e288]:
            - paragraph [ref=f303e289]:
              - strong [ref=f303e290]: На территории ILO CLUB запрещено оказывать тренерские услуги.
              - text: Тренировки доступны от тренеров команды ILO.
          - listitem [ref=f303e291]:
            - paragraph [ref=f303e292]:
              - strong [ref=f303e293]: "Отмена или перенос бронирования:"
              - text: За 24 часа до занятия — бесплатно. За 12–24 часа до занятия — возвращается 50% стоимости занятия. За менее чем 12 часов до занятия — сумма не возвращается.
