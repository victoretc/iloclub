              - paragraph [ref=f137e381]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f137e382]:
              - paragraph [ref=f137e383]: "Оплата возможна только через ЕРИП:"
              - list [ref=f137e384]:
                - listitem [ref=f137e385]: по карте через онлайн-банкинг;
                - listitem [ref=f137e386]: наличными через ЕРИП-терминалы по городу.
            - listitem [ref=f137e387]:
              - paragraph [ref=f137e388]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f137e389]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f137e390]:
              - paragraph [ref=f137e391]: "Отмена или перенос бронирования:"
              - list [ref=f137e392]:
                - listitem [ref=f137e393]: за 24 часа до занятия — бесплатно;
                - listitem [ref=f137e394]: за 12–24 часа до занятия — возвращается 50% стоимости занятия;
                - listitem [ref=f137e395]: менее чем за 12 часов до занятия — сумма не возвращается.
