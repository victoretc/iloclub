        - list [ref=f300e373]:
          - listitem [ref=f300e374]:
            - paragraph [ref=f300e375]:
              - strong [ref=f300e376]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - text: Администратор вправе не пустить на корт в случае, если сменной обуви у кого-то не будет, стоимость аренды в этом случае возвращаться не будет.
          - listitem [ref=f300e377]:
            - paragraph [ref=f300e378]:
              - strong [ref=f300e379]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - text: Без полной оплаты мы не бронируем время, и оно остаётся открытым для других желающих.
          - listitem [ref=f300e380]:
            - paragraph [ref=f300e381]:
              - strong [ref=f300e382]: "Оплата возможна только через ЕРИП:"
              - text: по карте через онлайн банкинг; наличными через ЕРИП терминалы по городу.
          - listitem [ref=f300e383]:
            - paragraph [ref=f300e384]:
              - strong [ref=f300e385]: На территории ILO CLUB запрещено оказывать тренерские услуги.
              - text: Тренировки доступны от тренеров команды ILO.
          - listitem [ref=f300e386]:
            - paragraph [ref=f300e387]:
              - strong [ref=f300e388]: "Отмена или перенос бронирования:"
              - text: За 24 часа до занятия — бесплатно. За 12–24 часа до занятия — возвращается 50% стоимости занятия. За менее чем 12 часов до занятия — сумма не возвращается.
