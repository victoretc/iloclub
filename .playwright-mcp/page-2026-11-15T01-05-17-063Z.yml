                - listitem [ref=f99e386]: наличными через ЕРИП-терминалы по городу.
            - listitem [ref=f99e387]:
              - paragraph [ref=f99e388]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f99e389]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f99e390]:
              - paragraph [ref=f99e391]: "Отмена или перенос бронирования:"
