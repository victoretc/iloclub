          - heading "Правила посещения клуба" [level=2] [ref=f99e370]
          - paragraph [ref=f99e371]: Пять пунктов, которые действуют для всех гостей — от сменной обуви до отмены брони.
        - generic [ref=f99e372]:
          - figure [ref=f99e373]:
            - img "Памятка с правилами посещения ILO Club" [ref=f99e374]
          - list [ref=f99e375]:
            - listitem [ref=f99e376]:
              - paragraph [ref=f99e377]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f99e378]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
            - listitem [ref=f99e379]:
              - paragraph [ref=f99e380]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - paragraph [ref=f99e381]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f99e382]:
              - paragraph [ref=f99e383]: "Оплата возможна только через ЕРИП:"
              - list [ref=f99e384]:
