        - list [ref=f138e409]:
          - listitem [ref=f138e410]:
            - paragraph [ref=f138e411]:
              - strong [ref=f138e412]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - text: Администратор вправе не пустить на корт в случае, если сменной обуви у кого-то не будет, стоимость аренды в этом случае возвращаться не будет.
          - listitem [ref=f138e413]:
            - paragraph [ref=f138e414]:
              - strong [ref=f138e415]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - text: Без полной оплаты мы не бронируем время, и оно остаётся открытым для других желающих.
          - listitem [ref=f138e416]:
            - paragraph [ref=f138e417]:
              - strong [ref=f138e418]: "Оплата возможна только через ЕРИП:"
              - text: по карте через онлайн банкинг; наличными через ЕРИП терминалы по городу.
          - listitem [ref=f138e419]:
            - paragraph [ref=f138e420]:
              - strong [ref=f138e421]: На территории ILO CLUB запрещено оказывать тренерские услуги.
              - text: Тренировки доступны от тренеров команды ILO.
          - listitem [ref=f138e422]:
            - paragraph [ref=f138e423]:
              - strong [ref=f138e424]: "Отмена или перенос бронирования:"
              - text: За 24 часа до занятия — бесплатно. За 12–24 часа до занятия — возвращается 50% стоимости занятия. За менее чем 12 часов до занятия — сумма не возвращается.
