            - listitem [ref=f33e377]:
              - paragraph [ref=f33e378]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f33e379]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
