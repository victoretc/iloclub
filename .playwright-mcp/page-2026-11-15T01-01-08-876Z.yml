            - img "Памятка с правилами посещения ILO Club" [ref=f35e375]
          - list [ref=f35e376]:
            - listitem [ref=f35e377]:
              - paragraph [ref=f35e378]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f35e379]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
