            - listitem [ref=f97e384]:
              - paragraph [ref=f97e385]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f97e386]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f97e387]:
