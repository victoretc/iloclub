              - paragraph [ref=f97e377]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - paragraph [ref=f97e378]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f97e379]:
              - paragraph [ref=f97e380]: "Оплата возможна только через ЕРИП:"
