          - paragraph [ref=f97e368]: Пять пунктов, которые действуют для всех гостей — от сменной обуви до отмены брони.
        - generic [ref=f97e369]:
          - figure [ref=f97e370]:
            - img "Памятка с правилами посещения ILO Club" [ref=f97e371]
          - list [ref=f97e372]:
            - listitem [ref=f97e373]:
              - paragraph [ref=f97e374]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f97e375]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
