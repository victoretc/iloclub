          - heading "Правила посещения клуба" [level=2] [ref=f74e349]
          - paragraph [ref=f74e350]: Пять пунктов, которые действуют для всех гостей — от сменной обуви до отмены брони.
        - generic [ref=f74e351]:
          - figure [ref=f74e352]:
            - img "Памятка с правилами посещения ILO Club" [ref=f74e353]
          - list [ref=f74e354]:
            - listitem [ref=f74e355]:
              - paragraph [ref=f74e356]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f74e357]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
            - listitem [ref=f74e358]:
              - paragraph [ref=f74e359]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - paragraph [ref=f74e360]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f74e361]:
              - paragraph [ref=f74e362]: "Оплата возможна только через ЕРИП:"
              - list [ref=f74e363]:
                - listitem [ref=f74e364]: по карте через онлайн-банкинг;
                - listitem [ref=f74e365]: наличными через ЕРИП-терминалы по городу.
            - listitem [ref=f74e366]:
              - paragraph [ref=f74e367]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f74e368]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f74e369]:
              - paragraph [ref=f74e370]: "Отмена или перенос бронирования:"
              - list [ref=f74e371]:
                - listitem [ref=f74e372]: за 24 часа до занятия — бесплатно;
                - listitem [ref=f74e373]: за 12–24 часа до занятия — возвращается 50% стоимости занятия;
