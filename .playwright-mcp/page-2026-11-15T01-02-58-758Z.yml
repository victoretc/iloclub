            - listitem [ref=f49e349]:
              - paragraph [ref=f49e350]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f49e351]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
