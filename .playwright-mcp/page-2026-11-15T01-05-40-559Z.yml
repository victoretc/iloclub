          - paragraph [ref=f107e341]: Правила
          - heading "Правила посещения клуба" [level=2] [ref=f107e342]
          - paragraph [ref=f107e343]: Пять пунктов, которые действуют для всех гостей — от сменной обуви до отмены брони.
        - generic [ref=f107e344]:
          - figure [ref=f107e345]:
            - img "Памятка с правилами посещения ILO Club" [ref=f107e346]
          - list [ref=f107e347]:
            - listitem [ref=f107e348]:
              - paragraph [ref=f107e349]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f107e350]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
            - listitem [ref=f107e351]:
              - paragraph [ref=f107e352]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - paragraph [ref=f107e353]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f107e354]:
              - paragraph [ref=f107e355]: "Оплата возможна только через ЕРИП:"
              - list [ref=f107e356]:
                - listitem [ref=f107e357]: по карте через онлайн-банкинг;
                - listitem [ref=f107e358]: наличными через ЕРИП-терминалы по городу.
            - listitem [ref=f107e359]:
              - paragraph [ref=f107e360]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f107e361]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f107e362]:
              - paragraph [ref=f107e363]: "Отмена или перенос бронирования:"
              - list [ref=f107e364]:
                - listitem [ref=f107e365]: за 24 часа до занятия — бесплатно;
                - listitem [ref=f107e366]: за 12–24 часа до занятия — возвращается 50% стоимости занятия;
                - listitem [ref=f107e367]: менее чем за 12 часов до занятия — сумма не возвращается.
