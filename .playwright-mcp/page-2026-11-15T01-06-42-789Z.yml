        - generic [ref=f126e340]:
          - paragraph [ref=f126e341]: Правила
          - heading "Правила посещения клуба" [level=2] [ref=f126e342]
          - paragraph [ref=f126e343]: Пять пунктов, которые действуют для всех гостей — от сменной обуви до отмены брони.
        - generic [ref=f126e344]:
          - figure [ref=f126e345]:
            - img "Памятка с правилами посещения ILO Club" [ref=f126e346]
          - list [ref=f126e347]:
            - listitem [ref=f126e348]:
              - paragraph [ref=f126e349]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f126e350]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
            - listitem [ref=f126e351]:
              - paragraph [ref=f126e352]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - paragraph [ref=f126e353]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f126e354]:
              - paragraph [ref=f126e355]: "Оплата возможна только через ЕРИП:"
              - list [ref=f126e356]:
                - listitem [ref=f126e357]: по карте через онлайн-банкинг;
                - listitem [ref=f126e358]: наличными через ЕРИП-терминалы по городу.
            - listitem [ref=f126e359]:
              - paragraph [ref=f126e360]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f126e361]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f126e362]:
              - paragraph [ref=f126e363]: "Отмена или перенос бронирования:"
              - list [ref=f126e364]:
                - listitem [ref=f126e365]: за 24 часа до занятия — бесплатно;
                - listitem [ref=f126e366]: за 12–24 часа до занятия — возвращается 50% стоимости занятия;
                - listitem [ref=f126e367]: менее чем за 12 часов до занятия — сумма не возвращается.
