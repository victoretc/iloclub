          - heading "Правила посещения клуба" [level=2] [ref=f105e342]
          - paragraph [ref=f105e343]: Пять пунктов, которые действуют для всех гостей — от сменной обуви до отмены брони.
        - generic [ref=f105e344]:
          - figure [ref=f105e345]:
            - img "Памятка с правилами посещения ILO Club" [ref=f105e346]
          - list [ref=f105e347]:
            - listitem [ref=f105e348]:
              - paragraph [ref=f105e349]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f105e350]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
            - listitem [ref=f105e351]:
              - paragraph [ref=f105e352]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - paragraph [ref=f105e353]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f105e354]:
              - paragraph [ref=f105e355]: "Оплата возможна только через ЕРИП:"
              - list [ref=f105e356]:
                - listitem [ref=f105e357]: по карте через онлайн-банкинг;
                - listitem [ref=f105e358]: наличными через ЕРИП-терминалы по городу.
            - listitem [ref=f105e359]:
              - paragraph [ref=f105e360]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f105e361]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f105e362]:
              - paragraph [ref=f105e363]: "Отмена или перенос бронирования:"
              - list [ref=f105e364]:
                - listitem [ref=f105e365]: за 24 часа до занятия — бесплатно;
                - listitem [ref=f105e366]: за 12–24 часа до занятия — возвращается 50% стоимости занятия;
                - listitem [ref=f105e367]: менее чем за 12 часов до занятия — сумма не возвращается.
