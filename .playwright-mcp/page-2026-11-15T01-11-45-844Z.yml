      - generic [ref=f134e358]:
        - generic [ref=f134e359]:
          - paragraph [ref=f134e360]: Правила
          - heading "Правила посещения клуба" [level=2] [ref=f134e361]
          - paragraph [ref=f134e362]: Пять пунктов, которые действуют для всех гостей — от сменной обуви до отмены брони.
        - generic [ref=f134e363]:
          - figure [ref=f134e364]:
            - img "Памятка с правилами посещения ILO Club" [ref=f134e365]
          - list [ref=f134e366]:
            - listitem [ref=f134e367]:
              - paragraph [ref=f134e368]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f134e369]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
            - listitem [ref=f134e370]:
              - paragraph [ref=f134e371]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - paragraph [ref=f134e372]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f134e373]:
              - paragraph [ref=f134e374]: "Оплата возможна только через ЕРИП:"
              - list [ref=f134e375]:
                - listitem [ref=f134e376]: по карте через онлайн-банкинг;
                - listitem [ref=f134e377]: наличными через ЕРИП-терминалы по городу.
            - listitem [ref=f134e378]:
              - paragraph [ref=f134e379]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f134e380]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f134e381]:
              - paragraph [ref=f134e382]: "Отмена или перенос бронирования:"
              - list [ref=f134e383]:
                - listitem [ref=f134e384]: за 24 часа до занятия — бесплатно;
                - listitem [ref=f134e385]: за 12–24 часа до занятия — возвращается 50% стоимости занятия;
                - listitem [ref=f134e386]: менее чем за 12 часов до занятия — сумма не возвращается.
