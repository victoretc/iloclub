          - paragraph [ref=f70e350]: Пять пунктов, которые действуют для всех гостей — от сменной обуви до отмены брони.
        - generic [ref=f70e351]:
          - figure [ref=f70e352]:
            - img "Памятка с правилами посещения ILO Club" [ref=f70e353]
          - list [ref=f70e354]:
            - listitem [ref=f70e355]:
              - paragraph [ref=f70e356]: Вход в зал и на корт разрешён только в сменной обуви (бахилах).
              - paragraph [ref=f70e357]: Администратор вправе не пустить на корт, если сменной обуви у кого-то не будет. Стоимость аренды в этом случае не возвращается.
            - listitem [ref=f70e358]:
              - paragraph [ref=f70e359]: Для подтверждения вашего бронирования производится оплата полной стоимости занятия.
              - paragraph [ref=f70e360]: Без полной оплаты мы не бронируем время — оно остаётся открытым для других желающих.
            - listitem [ref=f70e361]:
              - paragraph [ref=f70e362]: "Оплата возможна только через ЕРИП:"
              - list [ref=f70e363]:
                - listitem [ref=f70e364]: по карте через онлайн-банкинг;
                - listitem [ref=f70e365]: наличными через ЕРИП-терминалы по городу.
            - listitem [ref=f70e366]:
              - paragraph [ref=f70e367]: На территории ILO Club запрещено оказывать тренерские услуги.
              - paragraph [ref=f70e368]: Тренировки доступны от тренеров команды ILO.
            - listitem [ref=f70e369]:
              - paragraph [ref=f70e370]: "Отмена или перенос бронирования:"
              - list [ref=f70e371]:
