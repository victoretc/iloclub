{{ if gt .TotalPages 1 }}
  <nav class="pagination wrap" aria-label="Навигация по страницам">
    {{ if .HasPrev }}
      <a href="{{ .Prev.URL }}" rel="prev">← Новее</a>
    {{ else }}<span></span>{{ end }}
    <span>Страница {{ .PageNumber }} из {{ .TotalPages }}</span>
    {{ if .HasNext }}
      <a href="{{ .Next.URL }}" rel="next">Старее →</a>
    {{ else }}<span></span>{{ end }}
  </nav>
{{ end }}
